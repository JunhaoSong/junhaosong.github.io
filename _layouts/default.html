<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<!-- Fonts and colors come from the theme set in _config.yml -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<!-- Layout only: left column + tabs -->
<style>
  .wrap { display: flex; gap: 48px; max-width: 1100px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; }
  .side { width: 300px; flex-shrink: 0; }
  .side img { width: 100%; max-width: 220px; height: auto; border-radius: 6px; }
  .side h1 { margin: 16px 0 8px; }
  .side p:last-child { white-space: nowrap; }
  .main { flex: 1; min-width: 0; }
  .tabs { text-align: right; border-bottom: 1px solid rgba(128, 128, 128, 0.3); padding-bottom: 8px; margin-bottom: 24px; }
  .tabs a { margin-left: 20px; opacity: 0.7; }
  .tabs a.active { opacity: 1; font-weight: 600; }
  .tab { display: none; }
  .tab.active { display: block; }
  .tab > :first-child { margin-top: 0; }
  @media (max-width: 700px) {
    .wrap { flex-direction: column; gap: 24px; }
    .side { width: 100%; }
    .tabs { text-align: left; }
    .tabs a { margin: 0 16px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap markdown-body">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="content">
{{ content }}
    </div>
  </div>
</div>
<script>
  // Split the rendered README: everything before the first "##" heading goes to the
  // left column; each "##" heading becomes a tab with the content below it.
  var side = document.getElementById("side");
  var tabs = document.getElementById("tabs");
  var content = document.getElementById("content");
  var tab = null;
  Array.from(content.children).forEach(function (el) {
    if (el.tagName === "H2") {
      tab = document.createElement("div");
      tab.className = "tab";
      tab.id = el.id || el.textContent.trim().toLowerCase();
      content.appendChild(tab);
      var a = document.createElement("a");
      a.href = "#" + tab.id;
      a.textContent = el.textContent;
      tabs.appendChild(a);
      el.remove();
    } else if (tab) {
      tab.appendChild(el);
    } else if (el.tagName === "P" && el.querySelector('a[href^="#"]') && !el.querySelector('a:not([href^="#"])')) {
      el.remove(); // the "Research · Publications · ..." line; the tabs replace it
    } else {
      side.appendChild(el);
    }
  });
  var img = side.querySelector("img");
  if (img) side.prepend(img); // photo on top

  function show() {
    var all = content.querySelectorAll(".tab");
    var id = location.hash.slice(1);
    if (!Array.from(all).some(function (t) { return t.id === id; })) id = all.length ? all[0].id : "";
    all.forEach(function (t) { t.classList.toggle("active", t.id === id); });
    tabs.querySelectorAll("a").forEach(function (a) { a.classList.toggle("active", a.hash === "#" + id); });
  }
  tabs.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      history.replaceState(null, "", a.hash);
      show();
    });
  });
  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
